name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must match vX.Y.Z, got: $TAG"
            exit 1
          fi
      - name: Check release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" > /dev/null; then
            echo "::error::no published release for tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply ruptures --remote
      - name: Upload version
        id: upload
        env:
          TAG: ${{ inputs.tag }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.jsonl
        run: |
          pnpm exec wrangler versions upload --tag "$TAG" --message "$TAG"
          version_id=$(jq -r 'select(.type=="version-upload") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          preview_url=$(jq -r 'select(.type=="version-upload") | .preview_url // empty' "$WRANGLER_OUTPUT_FILE_PATH")
          if [[ -z "$version_id" || -z "$preview_url" ]]; then
            echo "::error::wrangler versions upload reported no version_id or preview_url"
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.312
      - name: Golden check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREVIEW_URL: ${{ steps.upload.outputs.preview_url }}
          DISABLE_AUTOUPDATER: "1"
        run: pnpm golden -- --url "$PREVIEW_URL/mcp" --bare --log "$RUNNER_TEMP/golden.jsonl"
      - name: Upload golden log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: golden-${{ inputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/golden.jsonl
      - name: Promote version
        env:
          VERSION_ID: ${{ steps.upload.outputs.version_id }}
          TAG: ${{ inputs.tag }}
        run: pnpm exec wrangler versions deploy --version-id "$VERSION_ID" --percentage 100 --message "$TAG" --yes
      - name: Apply triggers
        run: pnpm exec wrangler triggers deploy
