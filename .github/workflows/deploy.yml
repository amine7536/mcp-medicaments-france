name: Deploy

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to deploy, e.g. v1.7.0
        type: string
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Check tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must match vX.Y.Z, got: $TAG"
            exit 1
          fi
      - name: Check release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! gh release view "$TAG" > /dev/null; then
            echo "::error::no published release for tag: $TAG"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.153.0"
          command: d1 migrations apply ruptures --remote
      - name: Deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.153.0"
          command: deploy
