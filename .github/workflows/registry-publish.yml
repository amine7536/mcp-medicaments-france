name: MCP registry publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/mcp-publisher
      - name: Publish server.json
        run: ./mcp-publisher publish
