name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to serve again, e.g. v1.8.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must match vX.Y.Z, got: $TAG"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Find the deployed version
        id: find
        env:
          TAG: ${{ inputs.tag }}
        run: |
          pnpm exec wrangler deployments list --json > "$RUNNER_TEMP/deployments.json"
          version_id=$(jq -r --arg tag "$TAG" '[.[] | select(.annotations["workers/message"] == $tag)] | sort_by(.created_on) | last | .versions[0].version_id // empty' "$RUNNER_TEMP/deployments.json")
          if [[ -z "$version_id" ]]; then
            echo "::error::no deployment of $TAG among the 10 most recent; use npx wrangler rollback <version-id>"
            exit 1
          fi
          echo "version_id=$version_id" >> "$GITHUB_OUTPUT"
      - name: Serve the version
        env:
          TAG: ${{ inputs.tag }}
          VERSION_ID: ${{ steps.find.outputs.version_id }}
        run: pnpm exec wrangler versions deploy --version-id "$VERSION_ID" --percentage 100 --message "rollback $TAG" --yes
