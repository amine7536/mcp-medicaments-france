name: Rollback

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose uploaded version to serve again, e.g. v1.8.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag must match vX.Y.Z, got: $TAG"
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Serve the tagged version
        env:
          TAG: ${{ inputs.tag }}
        run: pnpm exec wrangler versions deploy --version-tag "$TAG" --percentage 100 --message "rollback $TAG" --yes
      - name: Apply triggers
        run: pnpm exec wrangler triggers deploy
