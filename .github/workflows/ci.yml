name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: Runs per prompt
        type: string
        default: "3"
      prompt:
        description: Prompt to run
        type: choice
        options: [all, "1", "2", "3"]
        default: all

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm coverage

  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: test
    if: startsWith(github.head_ref, 'release-please--') || github.event_name == 'workflow_dispatch'
    concurrency:
      group: candidate
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CANDIDATE_URL: https://mcp-medicaments-france-candidate.pixelfactory.workers.dev
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply candidate D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --env candidate --remote
      - name: Import BDPM into the candidate
        run: |
          pnpm bdpm:import
          pnpm exec wrangler d1 execute DB --env candidate --remote --file .bdpm/bdpm.sql --yes
      - name: Deploy candidate
        run: |
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > "$RUNNER_TEMP/candidate.token"
          jq -n --arg t "$token" '{ADMIN_TOKEN: $t}' > "$RUNNER_TEMP/candidate.secrets"
          pnpm exec wrangler deploy --env candidate --secrets-file "$RUNNER_TEMP/candidate.secrets"
      - name: Ingest ANSM into the candidate
        run: |
          token=$(cat "$RUNNER_TEMP/candidate.token")
          if ! body=$(curl --silent --show-error --fail-with-body --retry 12 --retry-delay 10 --retry-all-errors --max-time 120 \
            -X POST -H "Authorization: Bearer $token" "$CANDIDATE_URL/admin/ingest"); then
            printf '%s\n' "$body"
            echo "::error::candidate ingest request failed after retries"
            exit 1
          fi
          printf '%s\n' "$body"
          # A retried request also prints the failed answers' bodies; read the last JSON answer.
          status=$(printf '%s\n' "$body" | jq -Rr 'fromjson? | .status // empty' | tail -n1)
          if [[ "$status" != "ok" ]]; then
            echo "::error::candidate ingest did not return status ok"
            exit 1
          fi
      - name: Smoke check
        run: |
          headers=(-H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -H "MCP-Protocol-Version: 2025-11-25")
          curl --fail --silent --show-error "${headers[@]}" -X POST "$CANDIDATE_URL/mcp" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"1.0.0"}}}' > /dev/null
          list=$(curl --fail --silent --show-error "${headers[@]}" -X POST "$CANDIDATE_URL/mcp" \
            -d '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
          count=$(printf '%s\n' "$list" | sed -n 's/^data: //p' | jq -s '[.[] | select(.id == 2) | .result.tools | length] | first // 0')
          if [[ "$count" != "6" ]]; then
            echo "::error::tools/list on $CANDIDATE_URL/mcp returned $count tools, expected 6"
            exit 1
          fi
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.312
      - name: Golden check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISABLE_AUTOUPDATER: "1"
          RUNS: ${{ inputs.runs || '3' }}
          PROMPT: ${{ inputs.prompt || 'all' }}
        run: |
          args=(--url "$CANDIDATE_URL/mcp" --bare --log "$RUNNER_TEMP/golden.jsonl" --runs "$RUNS")
          if [[ "$PROMPT" != "all" ]]; then args+=(--prompt "$PROMPT"); fi
          pnpm golden -- "${args[@]}"
      - name: Upload golden log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: golden-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || format('run{0}', github.run_id) }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/golden.jsonl
      - name: Delete candidate
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: pnpm exec wrangler delete --env candidate
